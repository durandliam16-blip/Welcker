<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcker – Connexion</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-canvas: #f8fafc;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --border-color: #e2e8f0;
            --border-strong: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition-fast: 140ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-canvas: #09090b;
                --bg-card: #121215;
                --bg-subtle: #18181b;
                --border-color: rgba(255, 255, 255, 0.08);
                --border-strong: rgba(255, 255, 255, 0.16);
                --text-primary: #fafafa;
                --text-secondary: #a1a1aa;
                --text-tertiary: #71717a;
                --primary-color: #3b82f6;
                --primary-hover: #60a5fa;
            }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-canvas);
            color: var(--text-primary);
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 380px;
        }

        /* ── Brand ───────────────────────────────────────────────────────── */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.4px;
        }

        /* ── Card ────────────────────────────────────────────────────────── */
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
        }

        .auth-card h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .auth-card .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* ── Tabs (Segmented control) ────────────────────────────────────── */
        .auth-tabs {
            display: flex;
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            padding: 3px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            gap: 2px;
        }

        .auth-tab {
            flex: 1;
            padding: 7px 12px;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }

        .auth-tab:hover {
            color: var(--text-primary);
        }

        .auth-tab.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            font-weight: 600;
        }

        /* ── Forms ───────────────────────────────────────────────────────── */
        .auth-form { display: none; }
        .auth-form.active { display: block; }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-card);
            outline: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        /* ── Bouton Soumission ───────────────────────────────────────────── */
        .btn-submit {
            width: 100%;
            padding: 9px 16px;
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background-color var(--transition-fast);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ── Messages & Feedback ─────────────────────────────────────────── */
        .msg {
            display: none;
            padding: 9px 12px;
            border-radius: var(--radius-md);
            font-size: 12.5px;
            margin-top: 12px;
            text-align: left;
            line-height: 1.4;
        }
        .msg.error {
            display: block;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .msg.success {
            display: block;
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }

        /* ── Spinner ─────────────────────────────────────────────────────── */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 11.5px;
            color: var(--text-tertiary);
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Brand -->
        <div class="brand">
            <div class="brand-logo">
                <img src="images/logo.png" alt="Welcker" onerror="this.parentElement.textContent='W'">
            </div>
            <span class="brand-name">Welcker</span>
        </div>

        <!-- Card -->
        <div class="auth-card">
            <h2>Espace personnel</h2>
            <p class="subtitle">Connectez-vous à votre tableau de bord financier</p>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Connexion</button>
                <button class="auth-tab" onclick="switchTab('signup')">Inscription</button>
            </div>

            <!-- Login Form -->
            <div id="form-login" class="auth-form active">
                <div class="form-group">
                    <label for="login-email">Adresse email</label>
                    <input type="email" id="login-email" placeholder="nom@exemple.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button class="btn-submit" id="btn-login" onclick="handleLogin()">
                    Se connecter
                </button>
                <div id="msg-login" class="msg"></div>
            </div>

            <!-- Signup Form -->
            <div id="form-signup" class="auth-form">
                <div class="form-group">
                    <label for="signup-name">Nom complet</label>
                    <input type="text" id="signup-name" placeholder="Prénom Nom" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Adresse email</label>
                    <input type="email" id="signup-email" placeholder="nom@exemple.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Mot de passe</label>
                    <input type="password" id="signup-password" placeholder="8 caractères minimum" autocomplete="new-password" required minlength="8">
                </div>
                <button class="btn-submit" id="btn-signup" onclick="handleSignup()">
                    Créer mon compte
                </button>
                <div id="msg-signup" class="msg"></div>
            </div>
        </div>

        <p class="footer-text">© 2026 Welcker · Gestion de patrimoine & investissements</p>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL      = 'https://qktbcgumyqjgbvcpynjo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdGJjZ3VteXFqZ2J2Y3B5bmpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MDQ0MDYsImV4cCI6MjA4NjM4MDQwNn0.Bjv4bb2gnXKG8-UY4oSUQrjaJIzNWEG_zM8_XTQbwsY';

        const { createClient } = window.supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Si déjà connecté -> rediriger directement
        sb.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.replace('index.html');
        });

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach((t, i) =>
                t.classList.toggle('active', (i === 0) === (tab === 'login'))
            );
            document.getElementById('form-login').classList.toggle('active', tab === 'login');
            document.getElementById('form-signup').classList.toggle('active', tab === 'signup');
            hideMsg('login'); hideMsg('signup');
        }

        function showMsg(form, text, type = 'error') {
            const el = document.getElementById(`msg-${form}`);
            el.textContent  = text;
            el.className    = `msg ${type}`;
        }
        function hideMsg(form) {
            const el = document.getElementById(`msg-${form}`);
            el.className = 'msg';
        }

        async function handleLogin() {
            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            if (!email || !password) { showMsg('login', 'Veuillez remplir tous les champs.'); return; }

            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<span class="spinner"></span>Connexion…';
            btn.disabled  = true;
            hideMsg('login');

            const { error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                showMsg('login', traduitErreur(error.message));
                btn.innerHTML = 'Se connecter';
                btn.disabled  = false;
            } else {
                btn.innerHTML = 'Redirection…';
                window.location.replace('index.html');
            }
        }

        async function handleSignup() {
            const name     = document.getElementById('signup-name').value.trim();
            const email    = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;

            if (!name || !email || !password) { showMsg('signup', 'Veuillez remplir tous les champs.'); return; }
            if (password.length < 8) { showMsg('signup', 'Le mot de passe doit contenir au moins 8 caractères.'); return; }

            const btn = document.getElementById('btn-signup');
            btn.innerHTML = '<span class="spinner"></span>Création…';
            btn.disabled  = true;
            hideMsg('signup');

            const { error } = await sb.auth.signUp({
                email, password,
                options: { data: { full_name: name } }
            });

            if (error) {
                showMsg('signup', traduitErreur(error.message));
                btn.innerHTML = 'Créer mon compte';
                btn.disabled  = false;
            } else {
                showMsg('signup', 'Compte créé avec succès. Vous pouvez maintenant vous connecter.', 'success');
                btn.innerHTML = 'Créer mon compte';
                btn.disabled  = false;
                setTimeout(() => switchTab('login'), 2500);
            }
        }

        function traduitErreur(msg) {
            if (msg.includes('Invalid login'))        return 'Email ou mot de passe incorrect.';
            if (msg.includes('Email not confirmed'))  return 'Veuillez confirmer votre email avant de vous connecter.';
            if (msg.includes('User already registered')) return 'Un compte existe déjà avec cet email.';
            if (msg.includes('Password should be'))   return 'Le mot de passe doit contenir au moins 8 caractères.';
            if (msg.includes('rate limit'))           return 'Trop de tentatives, réessayez dans quelques minutes.';
            return msg;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const loginActive = document.getElementById('form-login').classList.contains('active');
            if (loginActive) handleLogin(); else handleSignup();
        });
    </script>
</body>
</html>
